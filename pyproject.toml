[project]
name = "sentry-options"
version = "0.0.0"
requires-python = ">=3.11"

[project.scripts]
sentry-options-gen-stubs = "sentry_options_gen_stubs:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sentry_options_gen_stubs"]

[tool.setuptools.package-dir]
sentry_options_gen_stubs = "sentry-options-gen-stubs"

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pytest>=8",
    "sentry-devenv>=1.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# clients/python supports Python 3.11, so don't let pyupgrade use 3.12+ syntax.
target-version = "py311"
line-length = 120
extend-exclude = [
    # Generated by sentry-options-gen-stubs, which owns its formatting.
    "sentry-options/sentry_options/__init__.pyi",
    # Leave code samples in docs as written.
    "*.md",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "T10",  # debugger statements
    "Q",    # flake8-quotes
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
force-single-line = true
# Sort names case-insensitively, as reorder-python-imports did.
order-by-type = false
# The repo has a devenv/ directory, but `devenv` imports come from sentry-devenv.
known-third-party = ["devenv"]
required-imports = ["from __future__ import annotations"]
