repos:
-   repo: builtin
    hooks:
    -   id: check-yaml
    -   id: check-json
    -   id: check-toml
    -   id: check-executables-have-shebangs
    -   id: check-merge-conflict
    -   id: check-case-conflict
    -   id: end-of-file-fixer
        exclude_types: [svg]
    -   id: trailing-whitespace
        exclude_types: [svg]
    -   id: check-added-large-files
        args: ['--maxkb=1024']
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: name-tests-test
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
    -   id: shellcheck
        args: [--shell=sh, --enable=check-extra-masked-returns]
        # direnv runs .envrc with bash.
        exclude: ^\.envrc$
-   repo: local
    hooks:
    - id: sentry-options-gen-stubs
      name: Generate sentry_options mypy stubs
      # prek can't install this repo into the hook env from a local hook,
      # and the generator only needs the standard library, so run it directly.
      entry: python sentry-options-gen-stubs/__init__.py
      language: python
      files: ^sentry-options/schemas/|^sentry-options/sentry_options/
      pass_filenames: false
    - id: rustfmt
      name: format rust code
      language: system
      types: [rust]
      # keep edition in sync with Cargo.toml
      # There is no way to run cargo fmt for specific files,
      # rustfmt can do it but doesn't read Cargo.toml.
      # https://github.com/rust-lang/rustfmt/issues/4485
      entry: rustfmt --edition=2024
